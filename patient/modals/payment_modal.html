<div class="modal fade" id="newPaymentModal" tabindex="-1" aria-labelledby="newPaymentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" action="{% url 'patient:create_payment' patient.id %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title" id="newPaymentModalLabel">{% trans "Record Payment" %}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="{% trans 'Close' %}"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="id_amount" class="form-label">{% trans "Amount" %}</label>
                        {{ payment_form.amount }}
                    </div>
                    <div class="mb-3">
                        <label for="id_payment_method" class="form-label">{% trans "Payment Method" %}</label>
                        {{ payment_form.payment_method }}
                    </div>
                    <div class="mb-3">
                        <label for="id_payment_date" class="form-label">{% trans "Payment Date" %}</label>
                        {{ payment_form.payment_date }}
                    </div>
                    <div class="mb-3">
                        <label for="id_treatment_plan" class="form-label">{% trans "Treatment Plan" %}</label>
                        {{ payment_form.treatment_plan }}
                    </div>
                    <div class="mb-3">
                        <label for="id_notes" class="form-label">{% trans "Notes" %}</label>
                        {{ payment_form.notes }}
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans "Cancel"
                        %}</button>
                    <button type="submit" class="btn btn-primary">{% trans "Save Payment" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
