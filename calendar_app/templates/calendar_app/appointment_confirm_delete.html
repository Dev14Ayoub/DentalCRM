{% extends "base.html" %}
{% block content %}
<h1>Confirm Delete Appointment</h1>
<p>Are you sure you want to delete appointment: {{ object }}?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Confirm Delete</button>
</form>
<a href="{% url 'calendar_app:appointment_list' %}">Cancel</a>
{% endblock %}
