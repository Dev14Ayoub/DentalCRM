{% extends "base.html" %}
{% block content %}
<h1>Calendar</h1>
<div id="calendar"></div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      events: '/calendar/events/',  // API endpoint to fetch events
      editable: true,
      selectable: true,
      eventDrop: function(info) {
        // Handle event drag and drop to update appointment time
        fetch('/calendar/events/' + info.event.id + '/update/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
          },
          body: JSON.stringify({
            start_time: info.event.start.toISOString(),
            end_time: info.event.end ? info.event.end.toISOString() : null
          })
        }).then(response => {
          if (!response.ok) {
            alert('Failed to update appointment time.');
            info.revert();
          }
        });
      }
    });
    calendar.render();
  });
</script>
{% endblock %}
