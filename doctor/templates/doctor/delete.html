{% extends 'global/base.html' %}
{% load static %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">
            <div class="card shadow rounded-4 border-0">
                <div class="card-header bg-danger text-white rounded-top-4">
                    <h4 class="mb-0 text-center">{% trans "Delete Doctor" %}</h4>
                </div>
                
                <div class="card-body p-4">
                    <p>{% trans "Are you sure you want to delete the doctor:" %} <strong>{{ doctor.full_name }}</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between mt-4">
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="bi bi-trash me-2"></i>{% trans "Delete" %}
                            </button>
                            <a href="{% url 'doctor:list' %}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-x-circle me-2"></i>{% trans "Cancel" %}
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
